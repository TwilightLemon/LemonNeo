name: Desktop

on:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution and platform plugins
        run: dotnet build LemonNeo.slnx --configuration Release
      - name: Test desktop infrastructure and service integration
        run: dotnet test tests/LemonNeo.Desktop.Tests/LemonNeo.Desktop.Tests.csproj --configuration Release --no-build
      - name: Verify publish output
        run: dotnet publish src/LemonNeo.Desktop/LemonNeo.Desktop.csproj --configuration Release --no-restore --output artifacts/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: LemonNeo-Desktop-${{ matrix.os }}
          path: artifacts/desktop
